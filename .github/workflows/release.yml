# Builds the ready-to-install addon and attaches it to a GitHub release as
# zcity_csgo_gloves.zip.  Publish a release and the zip appears on it a few minutes later.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build the zip for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the build tools
        run: python -m pip install py7zr==1.1.4 lupa==2.8

      - name: Test the Lua code
        run: python tools/test_lua.py

      - name: Build the addon
        run: python build_addon.py --zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum build/zcity_csgo_gloves.zip
          gh release upload "$TAG" build/zcity_csgo_gloves.zip --clobber
