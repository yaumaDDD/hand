# Builds the ready-to-install addon and attaches it to a GitHub release as
# zcity_csgo_gloves.zip.  Publish a release and the zip appears on it a few minutes later
# (with content_report.txt next to it when the repository holds materials or models of other
# addons: where each of them was put, and what is still missing).
#
# The repository holds two versions of the Appearance Mod, and a build can only have one of them
# (tools/zcg_layout.py, PACK_VERSIONS): the release gets an archive for each -
# zcity_csgo_gloves.zip with the one the build takes by default and zcity_csgo_gloves_legacy.zip
# with the other. The names are those of VERSION_ZIPS there; tools/test_content.py checks that
# this file and that list agree.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build the zip for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the build tools
        run: python -m pip install py7zr==1.1.4 lupa==2.8

      - name: Test the Lua code
        run: python tools/test_lua.py

      - name: Test the Lua code with the other version of the Appearance Mod
        run: python tools/test_lua.py --pack "Z-City Appearance Mod LEGACY"

      - name: Test the placing of drop-in content
        run: python tools/test_content.py

      - name: Test sort_content as it is shipped
        run: python tools/test_sort_tool.py

      # (the unpacked archives are kept for the second build)
      - name: Build the addon
        run: python build_addon.py --zip --keep-temp

      - name: Build the addon with the other version of the Appearance Mod
        run: python build_addon.py --zip --pack "Z-City Appearance Mod LEGACY"

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum build/zcity_csgo_gloves.zip build/zcity_csgo_gloves_legacy.zip
          gh release upload "$TAG" build/zcity_csgo_gloves.zip build/zcity_csgo_gloves_legacy.zip --clobber
          # what the builds did with the materials and models of other addons, when they found any
          for report in build/content_report.txt build/content_report_legacy.txt; do
            if [ -f "$report" ]; then
              gh release upload "$TAG" "$report" --clobber
            fi
          done
